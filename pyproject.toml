[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "startlive"
dynamic = ["version", "dependencies"]
description = "A desktop application for starting Bilibili live streams"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "GPL-3.0-only AND LicenseRef-StartLive-Artwork"
license-files = ["LICENSE", "LICENSE-ARTWORK"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/Radekyspec/StartLive"
Source = "https://github.com/Radekyspec/StartLive"
Issues = "https://github.com/Radekyspec/StartLive/issues"

[project.scripts]
startlive = "StartLive:cli"

[tool.setuptools]
py-modules = ["StartLive"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "resources"]
exclude = ["*.__pycache__", "*.__pycache__.*"]
namespaces = true

[tool.setuptools.package-data]
resources = ["*.ico", "*.svg", "version.json"]

[tool.setuptools.dynamic]
version = { attr = "src.core.constant._version.__version__" }
dependencies = { file = ["requirements.txt"] }
