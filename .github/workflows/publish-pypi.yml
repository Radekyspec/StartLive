name: Build and publish PyPI package

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish to PyPI (for example 1.3.1)
        required: true
        type: string
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Write release version for this build
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          PUBLISH_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        shell: python
        run: |
          import os
          import runpy
          from packaging.version import Version

          version = os.environ["PUBLISH_VERSION"].removeprefix("v")
          # Reject invalid versions before building or publishing.
          Version(version)
          os.environ["APP_VERSION"] = version
          runpy.run_path("tools/write_version.py", run_name="__main__")
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Validate release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/check_distribution.py dist/*.whl --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist
      - name: Check installed command outside the checkout
        shell: bash
        run: python tools/check_distribution.py dist/*.whl

  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [ build, install ]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/startlive/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
