name: Python 3.11 compile check

on:
  push:
    branches:
      - "master"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
          - os: macos-15-intel
            architecture: x64
          - os: macos-latest
            architecture: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: ${{ matrix.architecture }}

      - name: Compile Python sources
        run: python -m compileall -q StartLive.py src tools tests
