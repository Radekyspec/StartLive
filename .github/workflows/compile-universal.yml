name: Compile universal binaries

on:
  push:
    branches:
      - "dev"
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        description: SemVer supplied by the merged release PR
        required: true
        type: string
      source_ref:
        description: Exact merge commit to compile
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ windows-2025-vs2026, macos-15-intel, macos-15 ]

    runs-on: ${{ matrix.os }}

    env:
      UPX_VERSION: "5.0.2"
      UPX_DIR: "${{ github.workspace }}/tools/upx"

    steps:
      - name: Check-out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Read version from _version.py
        shell: python
        run: |
          import os
          import sys
          sys.path.insert(0, '.')
          from startlive.core.constant._version import __version__
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write(f'VERSION={__version__}\n')

      - name: Set app version
        shell: python
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          import os
          version = os.environ["RELEASE_VERSION"] or os.environ["VERSION"]
          app_version = version
          if not os.environ["RELEASE_VERSION"] and os.environ["GITHUB_EVENT_NAME"] == "push":
              app_version += "+" + os.environ["GITHUB_SHA"][:7]
          # Native file/bundle versions require the numeric SemVer core.
          native_version = version.split("+", 1)[0].split("-", 1)[0]
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"APP_VERSION={app_version}\n")
              env_file.write(f"VERSION={native_version}\n")

      - name: Setup Python
        uses: actions/setup-python@v7
        if: matrix.os != 'macos-15'
        with:
          python-version: '3.14.6' # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt
            pyproject.toml

      - name: Setup Python for ARM
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6' # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: 'arm64' # optional x64 or x86. Defaults to x64 if not specified
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt
            pyproject.toml
        if: matrix.os == 'macos-15'

      - name: Prepare dependency metadata version
        env:
          # setuptools requires PEP 440; the app itself retains the full SemVer.
          APP_VERSION: ${{ env.VERSION }}
        run: |
          python tools/write_version.py

      - name: Install Dependencies
        run: |
          python -m pip install ".[pk]"

      - name: Generate _version.py
        run: |
          python tools/write_version.py

      - name: Install ImageIO for Mac
        if: runner.os == 'macOS'
        run: |
          pip install imageio

      - name: Build OBS PK plugin
        uses: ./.github/actions/build-obs-pk

      - name: Download UPX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\upx.zip"
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v${env:UPX_VERSION}/upx-${env:UPX_VERSION}-win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP\upx -Force
          $exepath = Get-ChildItem -Path $env:RUNNER_TEMP\upx -Recurse -Filter upx.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path $env:UPX_DIR | Out-Null
          Copy-Item $exepath.FullName -Destination "$env:UPX_DIR\upx.exe" -Force
          echo "$env:UPX_DIR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Executable for Windows
        if: runner.os == 'Windows'
        uses: Nuitka/Nuitka-Action@bb65ca8023bef5f41a2114acd387b5f36d860145 # main, pinned for release builds
        with:
          # 4.3.1 breaks OpenSSL private-key conversion in compiled RTC.
          nuitka-version: '4.2.2'
          update-check: never
          script-name: StartLive.py
          # mingw64: true
          msvc: latest
          mode: app
          output-dir: build
          report: build/nuitka-report.xml
          # enable-plugins: pyside6,upx
          enable-plugins: pyside6
          # Let aiortc imports and Nuitka's PyAV rules collect av. Forcing the
          # whole package scans its .py/native module pairs twice in 4.2.2.
          include-package: |
            startlive.core.pk
            aiortc
            aioice
          # Distribution metadata options are declared in StartLive.py.
          company-name: "Radekyspec"
          product-name: "StartLive开播器"
          file-description: "StartLive开播器"
          file-version: ${{ env.VERSION }}
          windows-icon-from-ico: "startlive/resources/icon_left.ico"
          windows-console-mode: "disable"
          noinclude-data-files: |
            resources/version.json
            resources/icon_left_macOS.ico
          # Keep the DLL inside the onefile payload, beside the other resources.
          include-raw-dir: startlive/resources=resources
          # onefile-no-compression: true
          # upx-disable-cache: true
          deployment: true

      - name: Build Executable for Mac
        uses: Nuitka/Nuitka-Action@bb65ca8023bef5f41a2114acd387b5f36d860145 # main, pinned for release builds
        if: runner.os == 'macOS'
        with:
          # Keep Windows and macOS on the same verified RTC compiler.
          nuitka-version: '4.2.2'
          update-check: never
          script-name: StartLive.py
          mode: app
          output-dir: build
          report: build/nuitka-report.xml
          enable-plugins: pyside6
          # Let aiortc imports and Nuitka's PyAV rules collect av. Forcing the
          # whole package scans its .py/native module pairs twice in 4.2.2.
          include-package: |
            startlive.core.pk
            aiortc
            aioice
          # Distribution metadata options are declared in StartLive.py.
          company-name: "Radekyspec"
          product-name: "StartLive开播器"
          file-description: "StartLive开播器"
          file-version: ${{ env.VERSION }}
          macos-app-version: ${{ env.VERSION }}
          macos-app-icon: "startlive/resources/icon_left_macOS.ico"
          macos-signed-app-name: "com.radekyspec.startlive"
          noinclude-data-files: resources/version.json
          # Preserve the whole OBS bundle without relocating its OBS/Qt dependencies.
          include-raw-dir: startlive/resources=resources
          deployment: true

      - name: Sign the bundled OBS plugin and refresh the app signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --sign - --timestamp=none \
            build/StartLive.app/Contents/MacOS/resources/obs-startlive-pk.plugin
          codesign --force --sign - --timestamp=none \
            --preserve-metadata=entitlements,identifier,flags build/StartLive.app

      - name: Archive macOS app with executable permissions and symbolic links
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARTIFACT_NAME: StartLive-v${{ env.APP_VERSION }}-${{ runner.os }}-${{ runner.arch }}
        run: ditto -c -k --sequesterRsrc --keepParent build/StartLive.app "build/$ARTIFACT_NAME.zip"

      - name: Upload macOS Artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          # With archive disabled, the filename determines the artifact name.
          # Also set name so overwrite deletes that same artifact on retries.
          name: StartLive-v${{ env.APP_VERSION }}-${{ runner.os }}-${{ runner.arch }}.zip
          path: build/StartLive-v${{ env.APP_VERSION }}-${{ runner.os }}-${{ runner.arch }}.zip
          archive: false
          overwrite: ${{ inputs.release_version != '' }}
          if-no-files-found: error

      - name: Upload Windows Artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: StartLive-v${{ env.APP_VERSION }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/*.exe
            build/*.bin
          include-hidden-files: true
          if-no-files-found: error
          overwrite: ${{ inputs.release_version != '' }}
