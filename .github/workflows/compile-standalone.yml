name: Compile standalone for Windows

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      UPX_VERSION: "5.0.2"
      UPX_DIR: "${{ github.workspace }}/tools/upx"

    steps:
      - name: Check-out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version from _version.py
        shell: python
        run: |
          import os
          import sys
          sys.path.insert(0, '.')
          from src.core.constant._version import __version__
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write(f'VERSION={__version__}\n')

      - name: Set app version
        shell: bash
        run: |
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Set VERSION for push
        if: github.event_name == 'push'
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "APP_VERSION=${VERSION}+${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
          architecture: 'x64'

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.6'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --no-dev --group build --python 3.14.6

      - name: Add uv environment to PATH
        shell: bash
        run: >-
          uv run --no-sync python -c
          'import os, sysconfig;
          open(os.environ["GITHUB_PATH"], "a").write(sysconfig.get_path("scripts") + "\n")'

      - name: Generate _version.py
        run: uv run --no-sync python tools/write_version.py

      - name: Download UPX (Windows)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\upx.zip"
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v${env:UPX_VERSION}/upx-${env:UPX_VERSION}-win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP\upx -Force
          $exepath = Get-ChildItem -Path $env:RUNNER_TEMP\upx -Recurse -Filter upx.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path $env:UPX_DIR | Out-Null
          Copy-Item $exepath.FullName -Destination "$env:UPX_DIR\upx.exe" -Force
          echo "$env:UPX_DIR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Executable for Windows
        uses: Nuitka/Nuitka-Action@99c9d3ab258c7008c0604617d925574101327e5d # main (pinned)
        with:
          nuitka-version: main
          script-name: StartLive.py
          # mingw64: true
          # Nuitka currently do not support mingw64 for Python 3.13
          # Wait for update in future
          msvc: latest
          mode: standalone
          enable-plugins: pyside6,upx
          company-name: "Radekyspec"
          product-name: "StartLive开播器"
          file-description: "StartLive开播器"
          file-version: ${{ env.VERSION }}
          windows-icon-from-ico: "resources/icon_left.ico"
          windows-console-mode: "disable"
          include-data-dir: "resources=resources"
          noinclude-data-files: |
            "resources/version.json"
            "resources/icon_left_macOS.ico"
          onefile-no-compression: true
          upx-disable-cache: true
          deployment: true

      - name: Flatten output
        run: |
          mkdir -p output
          mv build/StartLive.dist/* output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: StartLive-v${{ env.APP_VERSION }}-${{ runner.os }}-standalone
          path: |
            output/
          include-hidden-files: true
