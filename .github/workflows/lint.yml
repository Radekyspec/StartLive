name: Lint

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check lock file
        run: uv lock --check

      - name: Install all locked dependency groups
        run: uv sync --locked --all-groups --python "${{ matrix.python-version }}"

      - name: Smoke-test runtime imports
        run: >-
          uv run --no-sync python -c
          "import PySide6, PIL, qrcode, requests, socks, obsws_python,
          keyring, darkdetect, semver, qdarktheme, velopack, cryptography"

      - name: Run Ruff
        run: uv run --no-sync ruff check .

      - name: Run unit-test discovery
        shell: bash
        run: uv run --no-sync python -m unittest discover || test $? -eq 5
